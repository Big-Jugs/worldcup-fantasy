const SLOT_POS=['WFB','WFB','WFB','CTR','CTR','HLF','HLF','HOK','EDG','EDG','MID','MID','MID',...Array(8).fill('ANY')];

const P=DATA.players.filter(p=>p.marketEligible), C=DATA.countries,F=DATA.fixtures;const byId=Object.fromEntries(DATA.players.map(p=>[p.id,p]));const MARKET_IDS=new Set(P.map(p=>p.id));
const SCORING=[['tries','Tries',8],['goals','Goals',2],['fieldGoals','Field goals',5],['assists','Try assists',5],['lineBreaks','Line breaks',4],['lineBreakAssists','Line break assists',2],['tackles','Tackles',1],['tackleBreaks','Tackle breaks',2],['missedTackles','Missed tackles',-2],['offloadsHand','Offloads to hand',4],['offloadsGround','Offloads to ground',2],['errors','Errors',-2],['fortyTwenties','40/20 + 20/40',4],['penalties','Penalties conceded',-2],['sixAgain','Six-again conceded',-1],['sinBins','Sin bins',-5],['sendOffs','Send-offs',-10],['trySaves','Try saves',5],['kicksDefused','Kicks defused',1],['forcedDropouts','Forced drop-outs',2],['turnovers','Turnovers',4],['escapes','Escapes in-goal',2],['runMetres','Run metres',0],['kickMetres','Kick metres',0]];
const dollar=n=>'$'+Math.round(n).toLocaleString('en-AU'),shortDollar=n=>Math.abs(n)>=1000000?'$'+(n/1000000).toFixed(1).replace(/\.0$/,'')+'m':'$'+Math.round(n/1000).toLocaleString('en-AU')+'k';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const emptyLine=()=>({slots:Array(21).fill(null),captain:null,vice:null});

function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&o.version===1&&Array.isArray(o.teams)&&o.teams.length)return o;}catch(e){}return sampleState()}
let state=load(),tab='team',selectedSlot=null,nationFilter='ALL',posFilter='ALL',searchTerm='',sortBy='average',statusFilter='ALL',editingPlayer=null,toastTimer=null;
state.injured ||= {};

/* V7 market migration: preserves original saves and retains excluded roster records in DATA.
   It removes nonmarket players from every lineup to keep the Round 2/3 trade baseline consistent. */
const V7_BACKUP_KEY=KEY+'-pre-v7-backup';
function migrateV7Game(game){
 if(game.marketVersion===7)return {removed:0,teamsAffected:0,already:true};
 let removed=0,teamsAffected=0;const removedNames=new Set();
 for(const team of game.teams||[]){
  let affected=false;
  for(const line of Object.values(team.rounds||{})){
   if(!Array.isArray(line?.slots))continue;
   line.slots=line.slots.slice(0,21).concat(Array(Math.max(0,21-line.slots.length)).fill(null));
   for(let i=0;i<line.slots.length;i++){
    const id=line.slots[i];
    if(id&&!MARKET_IDS.has(id)){
     removed++;affected=true;removedNames.add(id);line.slots[i]=null;
    }
   }
   if(!line.slots.slice(0,13).includes(line.captain))line.captain=null;
   if(!line.slots.slice(0,13).includes(line.vice))line.vice=null;
  }
  if(affected)teamsAffected++;
 }
 game.marketVersion=7;
 game.marketMigration={removed,uniqueRemoved:removedNames.size,teamsAffected,undismissed:true,migratedAt:new Date().toISOString()};
 return {removed,teamsAffected,uniqueRemoved:removedNames.size};
}
function backupV7Save(raw, imported=false){
 try{const key=imported?KEY+'-import-pre-v7-backup':V7_BACKUP_KEY;
  if(imported||!localStorage.getItem(key))localStorage.setItem(key,raw);
 }catch(e){ /* Browser storage may be disabled; export is still available. */ }
}
try{
 const rawV6=localStorage.getItem(KEY);
 if(state.marketVersion!==7){
  if(rawV6)backupV7Save(rawV6,false);
  migrateV7Game(state);
  if(!rawV6)state.marketMigration.undismissed=false;
  save();
 }
}catch(e){
 // Continue in memory when private mode prevents access to browser storage.
 if(state.marketVersion!==7)migrateV7Game(state);
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Browser storage unavailable. Export saves to keep progress.',true)}}
function currentTeam(){return state.teams.find(t=>t.id===state.currentTeam)||state.teams[0]}
function getLineup(team,rd,create=false){if(team.rounds[rd])return team.rounds[rd];let j=rd-1;while(j>=1&&!team.rounds[j])j--;let original=team.rounds[j]||emptyLine();if(!create)return original;team.rounds[rd]=JSON.parse(JSON.stringify(original));return team.rounds[rd]}
function lineup(){return getLineup(currentTeam(),state.round,true)}
function spent(line){return line.slots.reduce((a,id)=>a+(id?byId[id]?.price||0:0),0)}
function countFilled(line){return line.slots.filter(Boolean).length}
function editLocked(){return !!state.roundLocks[state.round]}
function tradeCount(team,rd,line){if(rd===1)return 0;let prev=getLineup(team,rd-1);return prev.slots.filter(id=>id&&!line.slots.includes(id)).length}
function tradesAllowed(rd){return rd===1?Infinity:rd<=3?2:rd===4?3:4}
function playedScore(rd,id){const o=state.scores[rd]?.[id];if(!o)return null;if(!o.played)return {played:false,value:0,simulated:!!o.simulated};if(o.pointsOverride!==undefined&&o.pointsOverride!==null&&o.pointsOverride!=='')return {played:true,value:Number(o.pointsOverride)||0,simulated:!!o.simulated};let a=0;SCORING.forEach(([key,_,rate])=>{if(key==='runMetres')a+=Math.floor((+o[key]||0)/10);else if(key==='kickMetres')a+=Math.floor((+o[key]||0)/30);else a+=(+o[key]||0)*rate});return {played:true,value:a,simulated:!!o.simulated}}
function calcRound(team,rd){let line=getLineup(team,rd),seen=new Set(),scoring=[];let hasData=!!Object.keys(state.scores[rd]||{}).length, pending=0, total=0,substitutions=[];
 for(let i=0;i<17;i++){
  const id=line.slots[i];if(!id)continue;let res=playedScore(rd,id),use=id,original=id;
  if(res?.played===false){
   for(let k=17;k<21;k++){
    let rep=line.slots[k];if(!rep||seen.has(rep))continue;let rr=playedScore(rd,rep);if(!rr||!rr.played)continue;
    if(i<13&&!byId[rep].pos.includes(SLOT_POS[i]))continue;
    use=rep;res=rr;seen.add(rep);substitutions.push({out:original,in:rep});break;
   }
  }
  if(!res){pending++;continue}if(!res.played)continue;
  let pts=res.value;
  // Captain doubling applies to the named captain (or vice-captain when captain is DNP).
  let capId=line.captain,capStatus=capId?playedScore(rd,capId):null;
  let doubled= capId===use && res.played || (line.vice===use&&capStatus?.played===false);
  if(doubled)pts*=2;
  total+=pts;scoring.push({id:use,original,pts,doubled,raw:res.value});
 }
 return {total,pending,hasData,scoring,substitutions};}
function totalPoints(t,toRound=5){let sum=0;for(let r=1;r<=toRound;r++)sum+=calcRound(t,r).total;return sum}
function nationLabel(code){return C[code]?.[0]||'TBD'}function flag(code){return C[code]?.[1]||'🏉'}
function toast(message,error=false){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast'+(error?' error':'');t.textContent=message;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3100)}
function checkLegal(line,oldSlot,newId){if(!newId)return true;let p=byId[newId];if(!p)return false;if(oldSlot<13&&!p.pos.includes(SLOT_POS[oldSlot])){toast('This player is not eligible for '+POSNAME[SLOT_POS[oldSlot]]+'.',true);return false;}const n=spent(line)-(line.slots[oldSlot]?byId[line.slots[oldSlot]].price:0)+p.price;if(n>CAP){toast('Over the $11 million salary cap by '+dollar(n-CAP),true);return false;}return true}
function mutateLine(fn){if(editLocked()){toast('Round locked. Unlock it in Scoring & settings to make changes.',true);return}let t=currentTeam(),old=JSON.parse(JSON.stringify(lineup()));fn(lineup());if(tradeCount(t,state.round,lineup())>tradesAllowed(state.round)){t.rounds[state.round]=old;toast('Trade limit reached for this round ('+tradesAllowed(state.round)+').',true);return}save();render()}
function pickPlayer(id){let player=byId[id],l=lineup(),existing=l.slots.indexOf(id);if(existing!==-1){tab='team';selectSlot(existing);toast('Already selected: '+player.name);return}
 if(editLocked()){toast('This round is locked.',true);return}
 let target=selectedSlot!==null?selectedSlot:-1;
 if(target>=0&&!checkLegal(l,target,id))return;
 if(target===-1){target=l.slots.findIndex((x,i)=>!x&&(i>=13||player.pos.includes(SLOT_POS[i])));}
 if(target===-1){toast('Select a team slot first, then choose a replacement.',true);return}
 if(!checkLegal(l,target,id))return;
 const oldId=l.slots[target];mutateLine(a=>{a.slots[target]=id;if(oldId && oldId===a.captain)a.captain=null;if(oldId && oldId===a.vice)a.vice=null});selectedSlot=nextEmptySlot(lineup());posFilter=selectedSlot!==null&&selectedSlot<13?SLOT_POS[selectedSlot]:'ALL';render();toast(player.name+' added to your squad.');}
function nextEmptySlot(l){const i=l.slots.findIndex(x=>!x);return i===-1?null:i}
function swapSlots(from,to){if(from===to)return;if(editLocked()){toast('Round is locked.',true);return}const line=lineup(),id1=line.slots[from],id2=line.slots[to];if(id1&&to<13&&!byId[id1].pos.includes(SLOT_POS[to])){toast('First player cannot play in that position.',true);return}if(id2&&from<13&&!byId[id2].pos.includes(SLOT_POS[from])){toast('Second player cannot play in that position.',true);return}mutateLine(a=>{[a.slots[from],a.slots[to]]=[a.slots[to],a.slots[from]];if(a.captain&&!a.slots.slice(0,13).includes(a.captain))a.captain=null;if(a.vice&&!a.slots.slice(0,13).includes(a.vice))a.vice=null});selectedSlot=to;posFilter=to<13?SLOT_POS[to]:'ALL';render()}
function setCaptain(id,which){let l=lineup();if(!l.slots.slice(0,13).includes(id)){toast('Captains must be in the starting 13.',true);return}mutateLine(a=>{if(which==='captain'){a.captain=id;if(a.vice===id)a.vice=null}else{a.vice=id;if(a.captain===id)a.captain=null}})}
function removeSlot(i){mutateLine(l=>{let id=l.slots[i];l.slots[i]=null;if(l.captain===id)l.captain=null;if(l.vice===id)l.vice=null});selectedSlot=i}
function makeAutoTeam(){if(state.round>1){toast('Auto-build is available in Round 1 only. Use your trade allowance in later rounds.',true);return}if(editLocked()){toast('Unlock this round first.',true);return}
 let l=emptyLine(),used=new Set();for(let i=0;i<21;i++){let pool=P.filter(p=>!used.has(p.id)&&(i>=13||p.pos.includes(SLOT_POS[i])));pool.sort((a,b)=>a.price-b.price);let p=pool[0];if(!p)break;l.slots[i]=p.id;used.add(p.id)}
 // Improve cheapest roster for best projection per dollar under cap, keeping remaining roster within budget.
 for(let step=0;step<46;step++){let best=null,bestGain=0;let assigned=new Set(l.slots.filter(Boolean));for(let i=0;i<21;i++){let old=byId[l.slots[i]];if(!old)continue;for(let p of P){if(assigned.has(p.id)||i<13&&!p.pos.includes(SLOT_POS[i]))continue;let extra=p.price-old.price;if(spent(l)+extra>CAP)continue;let gain=(p.rating-old.rating)*(i<17?1:0.18);if(gain<=0)continue;let value=gain/(Math.max(90000,extra+100000));if(value>bestGain){bestGain=value;best=[i,p.id]}}}if(!best)break;l.slots[best[0]]=best[1]}
 // Spend the remaining budget on high-value upgrades as long as they improve the team.
 let capCandidates=Array.from({length:80},()=>null);for(let iter=0;iter<70;iter++){
  let options=[];let ids=new Set(l.slots);
  for(let i=0;i<21;i++){let old=byId[l.slots[i]];for(let p of P){if(ids.has(p.id)||i<13&&!p.pos.includes(SLOT_POS[i])||p.rating<=old.rating)continue;if(spent(l)+p.price-old.price>CAP)continue;options.push({i,id:p.id,extra:p.price-old.price,gain:(p.rating-old.rating)*(i<13?1.25:i<17?1:0.24)})}}
  options.sort((a,b)=>b.gain/(b.extra+120000)-a.gain/(a.extra+120000));if(!options.length)break;l.slots[options[0].i]=options[0].id;
 }
 let starters=l.slots.slice(0,13).map(id=>byId[id]).sort((a,b)=>b.rating-a.rating);l.captain=null;l.vice=null;
 mutateLine(a=>{a.slots=l.slots;a.captain=l.captain;a.vice=l.vice});selectedSlot=null;posFilter='ALL';render();toast('Demo squad selected. You can replace any player.');}
function simulateRound(rd){if(!confirm('Generate clearly labelled TEST scores for '+RD_NAMES[rd]+'? Existing scores in this round will be replaced.'))return;
 let active=rd<=3?new Set(F.filter(f=>f[1]===rd).flatMap(f=>[f[2],f[3]])):new Set(rd===4?['AUS','NZL','SAM','TON']:['AUS','SAM']);let rec={};
 for(let p of P){if(!active.has(p.nation)){rec[p.id]={played:false,simulated:true};continue}let r=seeded(p.id+'-'+rd),didPlay=r()>.085;let variance=(r()-.5)*42,change=Math.max(0,Math.round(p.rating+variance+(r()>.90?13:0)));rec[p.id]=didPlay?{played:true,pointsOverride:change,simulated:true}:{played:false,simulated:true}}
 state.scores[rd]=rec;save();render();toast('Test scores generated for '+RD_NAMES[rd]+'. Not real match results.');}
function seeded(str){let a=2166136261;for(let i=0;i<str.length;i++)a=Math.imul(a^str.charCodeAt(i),16777619);return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296}}
function viewBadge(){return '<span class="pill gold">UNOFFICIAL FAN PROTOTYPE</span>'}
function header(){return `<header class="mast"><div class="brand"><div class="brandmark">🏉</div><div class="brandtext"><small>RUGBY LEAGUE WORLD CUP · 2026</small><h1>WORLD CUP <span style="color:var(--green)">FANTASY</span></h1></div></div><div class="mast-right">${viewBadge()}<span class="chip"><span class="live-dot"></span> OFFLINE · SAVES LOCALLY</span></div></header><nav class="nav" aria-label="Main navigation">${[['team','MY TEAM'],['players','PLAYER MARKET'],['fixtures','FIXTURES'],['leaderboard','LEADERBOARD'],['scoring','SCORING & SETTINGS'],['rules','RULES']].map(([v,n])=>`<button data-tab="${v}" class="${tab===v?'active':''}">${n}</button>`).join('')}</nav>`}

function summary(){let l=lineup(),calc=calcRound(currentTeam(),state.round),filled=countFilled(l),balance=CAP-spent(l),overall=totalPoints(currentTeam());return `<section class="statstrip"><div class="stat"><label>Squad</label><strong>${filled}<span style="color:#829ca0;font-size:20px"> / 21</span></strong><div class="progress"><span style="width:${filled/21*100}%"></span></div></div><div class="stat"><label>Salary remaining</label><strong class="${balance<0?'warn-text':'good-text'}">${shortDollar(balance)}</strong><div><small>${shortDollar(spent(l))} spent of $10m</small></div></div><div class="stat"><label>${RD_NAMES[state.round]} points</label><strong>${calc.hasData?calc.total.toLocaleString('en-AU'):'—'}</strong><div><small>${calc.hasData?`${calc.pending} pending scores`:'Awaiting scores / test simulation'}</small></div></div><div class="stat"><label>Total points</label><strong>${overall.toLocaleString('en-AU')}</strong><div><small>${state.round===1?'Unlimited preseason changes':`${tradeCount(currentTeam(),state.round,l)} / ${tradesAllowed(state.round)} trades this round`}</small></div></div></section>`}
function slotHTML(i){let l=lineup(),id=l.slots[i],player=byId[id],role=i<13?SLOT_POS[i]:i<17?'INT':'EMG',selected=i===selectedSlot;

function teamArea(){let l=lineup(),chosen=selectedSlot!==null?byId[l.slots[selectedSlot]]:null;return `<div class="card"><div class="card-head"><div><h3>ON THE FIELD</h3><small>13 starting players · C and VC must start</small></div><span class="pill ${editLocked()?'gray':''}">${editLocked()?'🔒 ROUND LOCKED':countFilled(l)===21?'✓ FULL SQUAD':'TEAM BUILDER'}</span></div><div class="teamground">${POSGROUPS.map(([pos,start,end])=>`<div class="position-row"><div class="position-name"><span>${POSNAME[pos]}</span><span>${end-start} required</span></div><div class="slot-grid ${end-start===2?'two':end-start===1?'one':''}">${Array.from({length:end-start},(_,j)=>slotHTML(start+j)).join('')}</div></div>`).join('')}</div><div class="bench"><h4>INTERCHANGE · SCORING BENCH <span class="muted">(4)</span></h4><div class="bench-grid">${[13,14,15,16].map(slotHTML).join('')}</div><h4 style="margin-top:17px">EMERGENCIES · AUTO-SUB ORDER <span class="muted">(4)</span></h4><div class="bench-grid">${[17,18,19,20].map(slotHTML).join('')}</div><div class="notes">${selectedSlot===null?'Tip: select a player slot to buy, sell, captain or switch positions.':`Selected: <b>${selectedSlot<13?POSNAME[SLOT_POS[selectedSlot]]:selectedSlot<17?'Interchange '+(selectedSlot-12):'Emergency '+(selectedSlot-16)}</b>${chosen?' · '+esc(chosen.name):' · vacant'}`}</div>${selectedSlot!==null&&chosen?`<div class="stack" style="margin-top:10px">${selectedSlot<13?`<button class="btn sm" data-action="captain" data-id="${chosen.id}">★ Make captain</button><button class="btn sm" data-action="vice" data-id="${chosen.id}">V Make vice</button>`:''}<button class="btn sm danger" data-action="remove" data-index="${selectedSlot}">Remove player</button><button class="btn sm" data-action="edit-player" data-id="${chosen.id}">Edit score</button></div>`:''}</div></div>`}
function marketList(){let selected=selectedSlot!==null?SLOT_POS[selectedSlot]:'ANY';let taken=new Set(lineup().slots.filter(Boolean));let arr=P.filter(p=> (nationFilter==='ALL'||p.nation===nationFilter)&&(posFilter==='ALL'||p.pos.includes(posFilter)) && (statusFilter!=='ELIGIBLE'||selected==='ANY'||p.pos.includes(selected)) && (p.name.toLowerCase().includes(searchTerm.toLowerCase())||nationLabel(p.nation).toLowerCase().includes(searchTerm.toLowerCase())));
 arr.sort((a,b)=>sortBy==='price-up'?a.price-b.price:sortBy==='price-down'?b.price-a.price:sortBy==='name'?a.name.localeCompare(b.name):b.rating-a.rating);
 return `<div class="market-results" id="marketResults">${arr.length?arr.map(p=>`<div class="player"><div class="avatar">${flag(p.nation)}</div><div style="min-width:0"><div class="player-name">${esc(p.name)}</div><div class="player-extra">${p.nation} · ${p.pos.join(' / ')} · ${p.rating} proj pts*</div></div><div class="pricetag">${shortDollar(p.price)}<small>EST.</small></div><button class="btn sm ${taken.has(p.id)?'':'primary'}" data-action="pick" data-id="${p.id}">${taken.has(p.id)?'IN TEAM':'ADD +'}</button></div>`).join(''):`<div class="empty-state">No matching players. Try adjusting your filters.</div>`}</div>`}
function marketArea(full=false){return `<div class="card"><div class="card-head"><div><h3>PLAYER MARKET</h3><small>Official 2026 selections · illustrative prices & player ratings</small></div><span class="pill gray">${P.length} PLAYERS</span></div><div class="market-controls"><input aria-label="Search players" class="search" id="playerSearch" placeholder="Search players or nations..." value="${esc(searchTerm)}"><div class="filters"><select class="select" id="filterPos"><option value="ALL">All positions</option>${POS.map(p=>`<option ${posFilter===p?'selected':''} value="${p}">${p}</option>`).join('')}</select><select class="select" id="filterNation"><option value="ALL">All nations</option>${Object.entries(C).map(([c,d])=>`<option ${nationFilter===c?'selected':''} value="${c}">${d[1]} ${d[0]}</option>`).join('')}</select><select class="select" id="filterSort"><option value="rating" ${sortBy==='rating'?'selected':''}>Price high–low</option><option value="price-up" ${sortBy==='price-up'?'selected':''}>Price: low–high</option><option value="price-down" ${sortBy==='price-down'?'selected':''}>Price: high–low</option><option value="name" ${sortBy==='name'?'selected':''}>Name A–Z</option></select></div><div class="stack"><button class="btn sm ${statusFilter==='ELIGIBLE'?'primary':''}" data-action="toggle-eligible">${statusFilter==='ELIGIBLE'?'✓ ':''}Eligible for selected slot</button><span class="muted" style="font-size:10px">*Projections are modelled, not official NRL figures.</span></div></div>${marketList()}</div>`}
function myTeam(){return `${summary()}<div class="layout">${teamArea()}${marketArea()}</div><div class="stack" style="margin-top:18px"><button data-action="autofill" class="btn primary">⚡ Auto-build a test squad</button><button data-action="clear-team" class="btn">Clear current squad</button><button data-action="simulate" class="btn" data-round="${state.round}">🎲 Simulate ${RD_NAMES[state.round]}</button><span class="muted" style="font-size:11px">Demo scores are simulated and explicitly tagged — not official results.</span></div>`}
function fixturesPage(){return `<div class="widepage"><div class="grid2">${[1,2,3,4,5].map(r=>`<div class="card"><div class="card-head"><h3>${RD_NAMES[r]}</h3><span class="pill gray">${F.filter(f=>f[1]===r).length} MATCHES</span></div><div class="fixture-list">${F.filter(f=>f[1]===r).map(f=>`<div class="fixture"><div class="fixture-date">${new Date(f[0]+'T12:00:00').toLocaleDateString('en-AU',{month:'short',day:'numeric'})}<small>${new Date(f[0]+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short'})}</small></div><div class="fixture-match"><span>${flag(f[2])} ${f[2]}</span><span class="vs">v</span><span>${flag(f[3])} ${f[3]}</span></div><div class="fixture-venue">${esc(f[4])}</div></div>`).join('')}</div></div>`).join('')}</div><div class="field-note">Semi-final and final participants are to be confirmed. The 2026 men's competition features 10 nations in three groups; Groups B and C play cross-group matches.</div></div>`}
function leaderboardPage(){let leader=[...state.teams].sort((a,b)=>totalPoints(b,state.round)-totalPoints(a,state.round));return `<div class="widepage"><div class="card"><div class="card-head"><div><h3>LOCAL LEAGUE STANDINGS</h3><small>Scores include rounds 1 through ${RD_NAMES[state.round]}, using each team's saved lineups</small></div><button data-action="new-team" class="btn primary sm">+ Add competitor</button></div><div style="overflow-x:auto"><table class="leaderboard-table"><thead><tr><th>#</th><th>Fantasy squad</th>${[1,2,3,4,5].map(r=>`<th>${r<=3?'R'+r:r===4?'SF':'F'}</th>`).join('')}<th>Total</th></tr></thead><tbody>${leader.map((t,i)=>`<tr><td>${i+1}</td><td><b>${esc(t.name)}</b>${t.id===state.currentTeam?' <span class="pill">YOUR ACTIVE TEAM</span>':''}<div class="muted" style="font-size:10px">${countFilled(getLineup(t,1))} players selected in R1</div></td>${[1,2,3,4,5].map(r=>`<td>${calcRound(t,r).hasData?calcRound(t,r).total:'—'}</td>`).join('')}<td class="pts">${totalPoints(t,state.round)}</td></tr>`).join('')}</tbody></table></div></div><div class="field-note">This is a local hot-seat league: you can create multiple teams on the same browser, but it does not yet support remotely connected friends or shared live standings.</div><div class="stack"><button class="btn" data-action="export">Export league save</button><button class="btn" data-action="import">Import league save</button></div></div>`}
function scoringPage(){let s=state.scores[state.round]||{},scored=Object.values(s).filter(v=>v.played).length,sim=Object.values(s).filter(v=>v.simulated).length;return `<div class="widepage"><div class="grid2"><div class="card"><div class="card-head"><h3>ROUND SCORING</h3><span class="pill gray">${RD_NAMES[state.round]}</span></div><div class="panel-body"><p><b>${scored}</b> player scores recorded · <b>${sim}</b> entries from test mode. Pick any player in the table below to enter a fantasy score or a full NRL-style stat line.</p><div class="stack"><button class="btn primary" data-action="simulate" data-round="${state.round}">🎲 Generate test results</button><button class="btn" data-action="clear-scores">Clear round scores</button></div><div class="scorebox"><div><span>Round editing</span><div class="muted" style="font-size:11px">Manual lockout simulation</div></div><button class="btn ${editLocked()?'warn':''}" data-action="lock">${editLocked()?'🔓 Unlock round':'🔒 Lock round'}</button></div><p>Use the player picker below to open the scoring editor. To import a batch of points, use <b>Import scores CSV</b> in Game data.</p></div></div><div class="card"><div class="card-head"><h3>GAME DATA & LOCAL LEAGUE</h3></div><div class="panel-body"><p>Game saves are stored in this browser. Export a backup before clearing site data. The league is playable locally; a server and player-statistics feed will be needed for real-time multiplayer.</p><div class="stack"><button class="btn primary" data-action="export">↓ Export save</button><button class="btn" data-action="import">↑ Import save</button><button class="btn" data-action="csv-import">↑ Import scores CSV</button></div><hr style="border:0;border-top:1px solid #365057;margin:18px 0"><div class="stack"><button class="btn danger" data-action="reset">Reset ALL saved progress</button><button class="btn" data-action="rename-team">Rename active team</button></div></div></div></div><div class="card"><div class="card-head"><h3>PLAYER SCORING EDITOR</h3><small>Search to open stats & points</small></div><div class="market-controls"><input class="search" id="scoreSearch" placeholder="Search a player to score (e.g. Reece Walsh)" value="${esc(searchTerm)}"></div><div style="max-height:430px;overflow:auto">${P.filter(p=>p.name.toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{let v=playedScore(state.round,p.id);return `<div class="player" style="grid-template-columns:35px 1fr 75px 76px"><div class="avatar">${flag(p.nation)}</div><div><div class="player-name">${esc(p.name)}</div><div class="player-extra">${p.nation} · ${p.pos.join('/')}</div></div><div class="pricetag">${v?v.played?v.value+' pts':'DNP':'—'}</div><button class="btn sm" data-action="edit-player" data-id="${p.id}">EDIT</button></div>`}).join('')}</div></div></div>`}
function rulesPage(){return `<div class="widepage"><div class="grid2"><div class="card"><div class="card-head"><h3>THE FORMAT</h3></div><div class="panel-body"><div class="howto">${[['Pick 21 players','Start 3 WFB, 2 CTR, 2 HLF, 1 HOK, 2 EDG, 3 MID; add 4 scoring interchange and 4 emergency reserves.'],['Stay under the cap','You have a $11 million starting salary cap. Fantasy prices in this prototype are estimates, not an official NRL feed.'],['Captain and vice-captain','Name two starters. Your captain earns double points; the vice-captain doubles only when your captain does not play.'],['Score 17 each round','Starting 13 plus interchange 4 contribute. Emergencies can substitute for a DNP, in bench priority order and with positional eligibility for field players.'],['Trade between rounds','Pre-tournament changes are unlimited. Prototype limit: 2 trades in each group round after R1; 3 at semi-finals; 4 for the final.'],['Play together locally','Create several fantasy teams, simulate matchdays and compare your league leaderboard on one device. Save and restore via JSON.']].map(([a,b],i)=>`<div class="step"><span class="number">${i+1}</span><div><b>${a}</b><div class="muted" style="font-size:12px;margin-top:4px">${b}</div></div></div>`).join('')}</div></div></div><div class="card"><div class="card-head"><h3>NRL FANTASY 2026-STYLE POINTS</h3></div><div class="panel-body"><div class="grid2" style="gap:4px">${SCORING.map(([k,name,val])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #2b424b;padding:6px 3px;font-size:11px;gap:7px"><span class="muted">${esc(name)}</span><b>${k==='runMetres'?'+1 / 10m':k==='kickMetres'?'+1 / 30m':val>0?'+'+val:val}</b></div>`).join('')}</div><p>For running and kicking metres, points are calculated by flooring metres divided by 10 and 30 respectively. Negative scoring categories and discipline events are included.</p></div></div></div><div class="field-note"><b>Important prototype limitations:</b> No live or historical player stat feed, automatic official price changes, actual web-hosted multiplayer, or automatic NRL kickoff lockouts. World Cup rosters and group fixtures come from published lists; positional eligibility, starting prices and projected scores are independent estimates. Demo scores must never be mistaken for match results.</div><div class="stack"><a href="https://fantasy.nrl.com/help/guidelines" target="_blank" rel="noopener" class="btn">Official NRL Fantasy guidelines ↗</a><a href="https://www.nrl.com/news/2026/10/07/irl-rugby-league-world-cup-mens-squads-released/" target="_blank" rel="noopener" class="btn">Official squad announcement ↗</a><a href="https://www.rlwc2026.com/draws-and-pools" target="_blank" rel="noopener" class="btn">Official World Cup draw ↗</a></div></div>`}
function render(){document.getElementById('app').innerHTML='<div class="shell">'+header()+hero()+(tab==='team'?myTeam():tab==='players'?`<div class="widepage">${marketArea(true)}<div class="field-note">Choose a slot on My Team to set where your next purchased player will go. Positions and prices are prototype estimates.</div></div>`:tab==='fixtures'?fixturesPage():tab==='leaderboard'?leaderboardPage():tab==='scoring'?scoringPage():rulesPage())+'<footer class="foot"><span>WORLD CUP FANTASY 26 · Made by Big Jugs · Unofficial fan game · Not affiliated with the NRL or World Cup organisers.</span><span>Verified squads: 7 October 2026 · Stats snapshot: October 2026 · Version 2.0</span></footer></div>';}
function redrawMarket(){if(tab==='team'||tab==='players'){let d=document.getElementById('marketResults');if(d)d.outerHTML=marketList()}else if(tab==='scoring'){let field=document.getElementById('scoreSearch');let pos=field?.selectionStart;render();if(pos!==null){let el=document.getElementById('scoreSearch');el?.focus();el?.setSelectionRange(pos,pos)}}}
function modal(html){document.getElementById('overlay').innerHTML='<div class="modal-backdrop" data-action="close-overlay"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>'}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function editScore(id){const p=byId[id];const entry=state.scores[state.round]?.[id]||{},score=playedScore(state.round,id);editingPlayer=id;
 modal(`<div class="modal-head"><div><div class="eyebrow">${RD_NAMES[state.round]} · SCORE ENTRY</div><h3>${flag(p.nation)} ${esc(p.name)}</h3></div><button class="btn sm" data-action="close-overlay">✕ Close</button></div><div class="body"><div class="formrow"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="playedBox" ${entry.played!==false?'checked':''}> Player took the field</label><span class="muted" style="font-size:11px">Uncheck to mark DNP</span></div><div class="formrow"><div style="flex:1"><label>Quick total fantasy points override</label><input type="number" id="quickPts" style="width:100%" placeholder="Leave empty to calculate from stats" value="${entry.pointsOverride===undefined||entry.pointsOverride===null?'':entry.pointsOverride}"></div><div class="muted" style="font-size:11px;max-width:210px">Use quick score OR fill the actual match stats below. Entering an override takes priority.</div></div><div class="stat-fields">${SCORING.map(([key,label,rate])=>`<div class="sfield"><label>${label} <span class="muted">${key==='runMetres'?'/10':key==='kickMetres'?'/30':(rate>=0?'+':'')+rate}</span></label><input min="0" type="number" data-field="${key}" value="${entry[key]||0}"></div>`).join('')}</div><div class="scorebox"><span>Current recorded points</span><strong>${score&&score.played?score.value:0}</strong></div><div class="stack" style="justify-content:flex-end"><button class="btn danger" data-action="delete-score" data-id="${id}">Clear entry</button><button class="btn" data-action="close-overlay">Cancel</button><button class="btn primary" data-action="save-score" data-id="${id}">Save player score</button></div></div>`)}
function saveScore(id){let obj={played:document.getElementById('playedBox').checked,simulated:false};const q=document.getElementById('quickPts').value.trim();if(q!=='')obj.pointsOverride=Number(q);for(let n of document.querySelectorAll('[data-field]'))obj[n.dataset.field]=Number(n.value)||0;(state.scores[state.round] ||= {})[id]=obj;save();closeModal();render();toast('Score saved for '+byId[id].name)}
function changeRound(r){state.round=r;getLineup(currentTeam(),r,true);selectedSlot=null;posFilter='ALL';save();render()}
function resetState(){if(!confirm('Reset every local team, line-up, and score? This cannot be undone without an exported save.'))return;state=sampleState();selectedSlot=null;posFilter='ALL';save();render();toast('Local game reset')}
function download(name,content,mime){const u=URL.createObjectURL(new Blob([content],{type:mime}));let a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function importSave(file){let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(v.version!==1||!Array.isArray(v.teams)||!v.teams.length||!v.teams.every(t=>t.id&&t.rounds))throw Error('Invalid save format');if(!confirm('Replace your current local game with this saved file?'))return;state=v;selectedSlot=null;posFilter='ALL';save();render();toast('Game save imported')}catch(e){toast('Unable to read save: '+e.message,true)}};reader.readAsText(file)}
function csvImport(file){let reader=new FileReader();reader.onload=()=>{let lines=reader.result.replace(/^\uFEFF/,'').trim().split(/\r?\n/),ok=0,bad=0;let heads=lines.shift().split(',').map(h=>h.trim().toLowerCase());const get=(cells,name)=>cells[heads.indexOf(name)]?.trim();for(let row of lines){let cells=row.split(',');let rd=Number(get(cells,'round')||state.round),playerName=get(cells,'player'),id=get(cells,'id')||P.find(p=>p.name.toLowerCase()===playerName?.toLowerCase())?.id,pts=get(cells,'points'),played=get(cells,'played');if(!byId[id]||rd<1||rd>5||!Number.isFinite(Number(pts))){bad++;continue}(state.scores[rd] ||= {})[id]={played:played===undefined||!['false','no','0'].includes(played.toLowerCase()),pointsOverride:Number(pts),simulated:false};ok++}save();render();toast('Imported '+ok+' scores'+(bad?' ('+bad+' skipped)':''))};reader.readAsText(file)}
function popupNewTeam(rename=false){let current=rename?currentTeam().name:'';modal(`<div class="modal-head"><h3>${rename?'Rename team':'Create a local fantasy team'}</h3><button class="btn" data-action="close-overlay">✕</button></div><div class="body"><p class="muted" style="font-size:12px">${rename?'Change the name shown in standings.':'New team competes on this same browser. Give it its own squad and captain.'}</p><label for="teamNameInput">Team name</label><input id="teamNameInput" type="text" maxlength="48" value="${esc(current)}" placeholder="e.g. Kangaroo Kings"><div class="stack" style="margin-top:20px;justify-content:flex-end"><button class="btn" data-action="close-overlay">Cancel</button><button class="btn primary" data-action="save-team" data-rename="${rename?'1':'0'}">${rename?'Save name':'Create team'}</button></div></div>`);document.getElementById('teamNameInput').focus()}
function saveTeam(rename){let n=document.getElementById('teamNameInput').value.trim();if(!n){toast('Please enter a team name',true);return}if(rename){currentTeam().name=n}else{let t={id:'team'+Date.now(),name:n,rounds:{1:emptyLine()}};state.teams.push(t);state.currentTeam=t.id;state.round=1}save();closeModal();selectedSlot=null;swappingFrom=null;tab='team';render();toast(rename?'Team renamed':'New team ready')}
function handleAction(b){let action=b.dataset.action,id=b.dataset.id,index=Number(b.dataset.index);switch(action){
 case 'pick':pickPlayer(id);break;
 case 'profile':playerProfile(id);break;
 case 'profile-pick':closeModal();pickPlayer(id);break;
 case 'profile-select':closeModal();selectSlot(index);break;
 case 'select-slot':selectSlot(index);break;
 case 'mark-injury':setInjury(id);break;
 case 'clear-slot':selectedSlot=null;swappingFrom=null;posFilter='ALL';render();break;
 case 'clear-filters':selectedSlot=null;swappingFrom=null;posFilter='ALL';nationFilter='ALL';searchTerm='';render();break;
 case 'captain':setCaptain(id,'captain');break;case 'vice':setCaptain(id,'vice');break;
 case 'sync-teamlists':syncTeamLists(true);break;
 case 'import-teamlists':document.getElementById('importTeamLists').click();break;
 case 'remove':removeSlot(index);break;
 case 'autofill':if(countFilled(lineup())&&!confirm('Replace the current round squad with an automatically selected sample team?'))break;makeAutoTeam();break;
 case 'clear-team':if(!confirm('Clear all 21 slots for this round?'))break;mutateLine(l=>{l.slots=Array(21).fill(null);l.captain=null;l.vice=null});selectedSlot=null;break;
 case 'toggle-eligible':statusFilter=statusFilter==='ELIGIBLE'?'ALL':'ELIGIBLE';render();break;
 case 'simulate':simulateRound(Number(b.dataset.round||state.round));break;
 case 'new-team':popupNewTeam();break;case 'rename-team':popupNewTeam(true);break;
 case 'save-team':saveTeam(b.dataset.rename==='1');break;
 case 'edit-player':editScore(id);break;case 'save-score':saveScore(id);break;
 case 'delete-score':delete (state.scores[state.round]||{})[id];save();closeModal();render();toast('Score entry cleared');break;
 case 'lock':state.roundLocks[state.round]=!editLocked();save();render();break;
 case 'clear-scores':if(confirm('Remove ALL recorded scores for '+RD_NAMES[state.round]+'?')){delete state.scores[state.round];save();render()}break;
 case 'export':download('world-cup-fantasy-2026-save.json',JSON.stringify(state,null,2),'application/json');toast('Game save exported');break;
 case 'import':document.getElementById('importSave').click();break;
 case 'csv-import':document.getElementById('importCsv').click();break;
 case 'reset':resetState();break;
 case 'close-overlay':closeModal();break;
 }}
function initials(name){return name.split(/\s+/).filter(Boolean).slice(-2).map(s=>s[0]).join('').toUpperCase()}
function avatarHTML(p,large=false){
 const c=C[p.nation]?.[2]||'#8bebbc';
 return `<span class="portrait ${large?'portrait-large':''}" style="--kit:${c}" aria-label="${esc(p.name)} portrait"><svg class="portrait-sil" viewBox="0 0 70 76" aria-hidden="true"><circle cx="35" cy="24" r="13" fill="#dbbaa0"/><path d="M23 18q12-19 24 0v7H23Z" fill="#17222c"/><path d="M7 76V58Q9 44 25 42l10 7 10-7q16 2 18 16v18Z" fill="var(--kit)"/><path d="m24 43 11 11 11-11" fill="none" stroke="#f7f8fa" stroke-width="5"/><path d="M11 67h48" stroke="#ffffff33" stroke-width="3"/></svg>${p.portrait?`<img loading="lazy" decoding="async" src="${esc(p.portrait)}" alt="${esc(p.name)} wearing a representative jersey" style="opacity:0" onload="this.style.opacity=1" onerror="this.remove()">`:''}</span>`;
}
function playerMark(p){let l=lineup(),i=l.slots.indexOf(p.id),injured=!!state.injured?.[p.id]; if(injured)return `<span class="key-icon injured" title="Marked injured (manual)">✚</span>`;if(i>=13&&i<17)return `<span class="key-icon interchange" title="Selected on interchange">I</span>`;if(i>=0)return `<span class="key-icon selected" title="Selected in squad">✓</span>`;return `<span class="key-icon absent" title="Not selected">×</span>`}
function keyLegend(){return `<div class="keylegend"><strong>PLAYER KEY</strong><span><i class="key-icon selected">✓</i> Selected</span><span><i class="key-icon absent">×</i> Not selected</span><span><i class="key-icon interchange">I</i> Interchange</span><span><i class="key-icon injured">✚</i> Injured*</span></div>`}
function selectSlot(i){let chosen=lineup().slots[i]; if(selectedSlot!==null&&selectedSlot!==i&&lineup().slots[selectedSlot]){swapSlots(selectedSlot,i);return}selectedSlot=i;posFilter=i<13?SLOT_POS[i]:'ALL';statusFilter='ALL';render();}
function setInjury(id){state.injured||={};state.injured[id]=!state.injured[id];if(!state.injured[id])delete state.injured[id];save();closeModal();render();toast(state.injured[id]?'Injury marker added (manual)':'Injury marker removed');}
function playerProfile(id){let p=byId[id];if(!p)return;let s=p.nrl2026||null,sl=p.super2026||null,idx=lineup().slots.indexOf(id),injured=!!state.injured?.[id];const stat=(label,value,unit='')=>`<div class="profile-stat"><span>${label}</span><strong>${value===null||value===undefined?'—':esc(value.toString())}${value===null||value===undefined?'':unit}</strong></div>`;
 modal(`<div class="modal-head profile-head"><div><div class="eyebrow">PLAYER PROFILE · 2026 CLUB SEASON</div><h3>${esc(p.name)}</h3></div><button class="btn sm" data-action="close-overlay" aria-label="Close player profile">✕</button></div><div class="profile-top"><div class="profile-photo">${avatarHTML(p,true)}</div><div class="profile-overview"><span class="nation-tag">${esc(p.nation)}</span><div class="profile-price">${shortDollar(p.price)} <small>World Cup estimated price</small></div><div class="profile-positions">${p.pos.map(pos=>`<span>${pos}</span>`).join('')}</div><div class="profile-roster">${playerMark(p)} ${idx>=0?idx<13?'Starting 13':idx<17?'Interchange bench':'Emergency':'Not in your team'}</div></div></div><div class="profile-content"><div class="profile-section-label">${sl?'2026 SUPER LEAGUE · ESTIMATED NRL FANTASY EQUIVALENT':'2026 NRL PREMIERSHIP · FANTASY STATISTICS'}</div><div class="profile-stats">${stat(sl?'Converted fantasy average':'Season average',s?.avg??sl?.avg??null)}${stat('Last 5 games average',s?.last5?Math.round(s.last5.reduce((a,b)=>a+b,0)/s.last5.length*10)/10:null)}${stat(sl?'Estimated fantasy points':'Total fantasy points',s?.total??sl?.totalEstimate??null)}${stat(sl?'Super League matches':'NRL games played',s?.games??sl?.games??null)}${stat('Price per avg point',(s?.avg??sl?.avg)?shortDollar(p.price/(s?.avg??sl?.avg)):null)}${stat('Last five scores',s?.last5?s.last5.join(' · '):null)}</div><p class="profile-source">${sl?'Calculated from the official 2026 Super League season totals for tries, try assists, tackles, missed tackles, tackle busts, clean breaks, metres, offloads, goals and discipline. Some NRL Fantasy categories are not published in compatible form (e.g. kicking metres, try saves and offloads to hand), so this is an APPROXIMATION, not a real official fantasy score. Offloads use the lower two-point value.':s?'NRL Fantasy 2026: published games and fantasy points, divided by appearances.':'No sufficiently detailed, verifi function tradeCount(team,rd,line){
 if(rd===1)return 0;
 const before=getLineup(team,rd-1).slots;

 return before.filter(id=>id&&!after.includes(id)).length;

function tradesAllowed(rd,team=currentTeam()){

 const cap=tradesAllowed(rd,team);
 const carry=rd===3?Math.max(0,3-tradeCount(team,2,getLineup(team,2))):0;

function mutateLine(fn){

 fn(line);

 if(new Set(ids).size!==ids.length)return fail('A player cannot occupy two squad positions.');
 if(ids.some(id=>!MARKET_IDS.has(id)))return fail('An excluded player cannot be selected in Version 7.');
 if(spent(line)>CAP)return fail('Squad exceeds the $11m salary cap.');
 for(let i=0;i<13;i++)if(line.slots[i]&&!byId[line.slots[i]]?.pos.includes(SLOT_POS[i]))return fail('A player is in an ineligible starting position.');
 const used=tradeCount(team,state.round,line),cap=tradesAllowed(state.round,team);
 if(used>cap)return fail(`Trade limit reached: ${cap} available in ${RD_NAMES[state.round]}. Unused Round 2 trades carry into Round 3.`);

<script>
/* World Cup Fantasy V7.3.1 — one shared, public team-list feed for EVERY visitor.

const WORLD_CUP_FEED_URL='https://raw.githubusercontent.com/Big-Jugs/worldcup-teamlists/main/worldcup-teamlists.json';
const AUTO_FEED_INTERVAL_MS=15*60*1000;
let liveLastChecked=null, liveLastSuccess=null, liveFeedMode='checking', liveFeedMessage='';
let liveFeedInFlight=null;
const v73StatusBase=statusFor;

};

 text=text.replace('Round 1: official 13 starters and four interchange per nation; extended reserves show as outside 17.',
                   'World Cup: starting 13, six interchange (14–19), extended reserves outside 19.').replace(/Outside 17/g,'Outside 19');
 const badgeClass=liveFeedMode==='connected'?'feed-ok':liveFeedMode==='error'?'feed-warning':'feed-wait';
 const message=liveFeedMode==='connected'?'Live team lists active':liveFeedMode==='error'?'Live feed temporarily unavailable — showing last verified lists':'Checking live team lists…';
 const checked=liveLastChecked?' · checked '+liveLastChecked.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}):'';
 const extra=liveFeedMode==='error'&&liveLastSuccess?' · last successful '+liveLastSuccess.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}):'';
 const sourceNote=`<div class="auto-source-note" role="status" aria-live="polite"><span class="auto-feed-indicator ${badgeClass}"><span class="auto-feed-dot" aria-hidden="true"></span>${esc(message)}</span><span class="auto-feed-timestamp">${esc(checked+extra)}</span></div>`;

 return text.replace('<span class="feed-buttons">',sourceNote+'<span class="feed-buttons">');
};
const v73LocalSync=syncTeamLists;
// Use the feed only. Never reset to the bundled static JSON on a failed check.
syncTeamLists=function(userInitiated=false){

 liveFeedMessage='';
 if(userInitiated)render();

   const target=new URL(WORLD_CUP_FEED_URL);

render();

// The GitHub endpoint supports cross-origin reads, so there is no reason to skip local files.
// The in-flight guard in syncTeamLists prevents duplicate requests from overlapping events.
void syncTeamLists(false);

});

});

</script><script id="wcf-v814-pricing-script">
/* World Cup Fantasy v8.14: settled player prices and genuine cash balances.
   Supabase is authoritative for price and cash, never the browser. */
const wcf14={loaded:false,loading:false,cash:null,serverByRound:{},priceHistory:{},lastRefresh:null,error:'',
 loadedForTeam:null,retryFailures:0,retryAfter:0};
// The original V8.14 market fetch could run before the cached account finished
// loading. An early return left the editor disabled until a manual refresh.
// Also never use cash fetched for a previous signed-in account.
function wcf14MarketReady(){
 return !!(mp.active&&mp.team&&wcf14.loaded&&wcf14.loadedForTeam===String(mp.team.id));
}
function wcf14SavedSlots(round=state.round){
 if(wcf14.serverByRound[round])return wcf14.serverByRound[round];
 for(let r=round-1;r>=1;r--)if(wcf14.serverByRound[r])return wcf14.serverByRound[r];
 return Array(21).fill(null);
}
function wcf14CashAtDraft(round=state.round){
 if(!wcf14MarketReady()||!Number.isFinite(wcf14.cash))return null;
 const oldSlots=new Set(wcf14SavedSlots(round).filter(Boolean));
 const newSlots=new Set((getLineup(currentTeam(),round)?.slots||[]).filter(Boolean));
 let cash=wcf14.cash;
 for(const id of oldSlots)if(!newSlots.has(id))cash+=byId[id]?.price||0;
 for(const id of newSlots)if(!oldSlots.has(id))cash-=byId[id]?.price||0;
 return cash;
}
async function wcf14RefreshMarket(){
 if(!mp.active||!mp.team||wcf14.loading)return;
 const requestedTeamId=String(mp.team.id);
 wcf14.loading=true;
 try{
  const id=encodeURIComponent(requestedTeamId);
  const [market,wallet,lineups,settlements,roundStatus]=await Promise.all([
   mpRequest('/rest/v1/wcf_players?select=id,price&market_eligible=eq.true'),
   mpRequest('/rest/v1/wcf_team_wallet?select=balance&team_id=eq.'+id),
   mpRequest('/rest/v1/wcf_lineups?select=round_number,slots,captain,vice_captain&team_id=eq.'+id),
   mpRequest('/rest/v1/rpc/wcf_price_round_status','POST',{},false),
   mpRequest('/rest/v1/wcf_rounds?select=round_number,status')
  ]);
  // An account switch while requests are in flight must not apply another
  // coach's wallet or saved lineup to the new account.
  if(!mp.active||String(mp.team?.id)!==requestedTeamId)throw Error('Account changed during market refresh');
  if(!Array.isArray(market)||market.length!==140)throw Error('Market pricing feed incomplete');
  if(!Array.isArray(wallet)||!Number.isFinite(Number(wallet[0]?.balance)))throw Error('Cash wallet unavailable');
  for(const row of market){const p=byId[row.id];if(p&&Number.isInteger(row.price))p.price=row.price;}
  wcf14.cash=Number(wallet[0].balance);
  wcf14.serverByRound={};for(const l of lineups||[])if(Array.isArray(l.slots))wcf14.serverByRound[Number(l.round_number)]=l.slots;
  // Refresh authoritative reopening state and carried-forward R2/R3 squads.
  // Never overwrite a pending or currently saving user draft.
  if(!Array.isArray(roundStatus))throw Error('Round status unavailable');
  mp.allowedRounds=new Set(roundStatus.filter(x=>x.status==='open').map(x=>Number(x.round_number)));
  mp.lastScoredRound=Math.max(0,...roundStatus.filter(x=>x.status==='scored').map(x=>Number(x.round_number)));
  if(typeof wcfRoundGateApply==='function')wcfRoundGateApply(roundStatus);
  if(!mp.pending&&!mp.saving&&mp.team){
   const own=currentTeam();
   for(const l of lineups||[])if(Array.isArray(l.slots)&&l.slots.length===21){
    own.rounds[Number(l.round_number)]={slots:l.slots,captain:l.captain,vice:l.vice_captain};
   }
  }
  wcf14.settlements=Array.isArray(settlements)?settlements:[];
  wcf14.loaded=true;wcf14.loadedForTeam=requestedTeamId;
  wcf14.error='';wcf14.lastRefresh=Date.now();
  wcf14.retryFailures=0;wcf14.retryAfter=0;
 }catch(err){
  wcf14.loaded=false;wcf14.loadedForTeam=null;
  wcf14.error=String(err.message||err);
  wcf14.retryFailures=Math.min(wcf14.retryFailures+1,6);
  wcf14.retryAfter=Date.now()+Math.min(30000,1000*2**wcf14.retryFailures);
  console.warn('Live market prices unavailable:',wcf14.error);
 }
 finally{wcf14.loading=false;render();}
}
const wcf14OldCheckLegal=checkLegal;
checkLegal=function(line,slot,id){

 if(slot<13&&!p.pos.includes(SLOT_POS[slot]))return wcf14OldCheckLegal(line,slot,id);
 if(!wcf14MarketReady()){toast('Checking live player prices and cash. Please wait.',true);return false;}
 const target=line.slots.slice();target[slot]=id;
 // Preview all unsaved squad changes relative to the last confirmed lineup.
 const server=new Set(wcf14SavedSlots().filter(Boolean)),current=new Set(target.filter(Boolean));
 let balance=wcf14.cash;
 for(const p of server)if(!current.has(p))balance+=byId[p]?.price||0;
 for(const p of current)if(!server.has(p))balance-=byId[p]?.price||0;
 if(balance<0){toast('Not enough available cash for this player ('+shortDollar(-balance)+' short).',true);return false;}
 return true;
};
// The original V7 browser validation summed today's market prices against

const wcf14OldMutate=mutateLine;

 team.rounds[state.round]=after;

const wcf14OldLoad=mpLoadAccount;
mpLoadAccount=async function(...args){

};
const wcf14OldFlush=mpFlush;

 if(!salary)return;

// On a cold reload, the multiplayer bootstrap in an earlier script is still

// Poll only until the current account has a verified wallet/market snapshot.
// Failures back off to at most one request per 30 seconds.
function wcf14EnsureInitialMarket(){

wcf14EnsureInitialMarket();
setInterval(wcf14EnsureInitialMarket,1000);
window.addEventListener('pageshow',wcf14EnsureInitialMarket);

setInterval(()=>{if(mp.active&&document.visibilityState==='visible'&&
 (wcf14.lastRefresh===null||Date.now()-wcf14.lastRefresh>5*60*1000))void wcf14RefreshMarket();},60*1000);
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&mp.active)void wcf14RefreshMarket();
});
</script>

<script id="wcf-round-nav-gate-script">
/* Frontend is for navigation only: Supabase wcf_rounds and existing lineup
 * validation remain authoritative for editing and the score settlement gate. */
const wcfNavGate={ready:false,status:new Map(),firstKickoff:new Map()};
function wcfRoundGateCanSelect(round){
 const r=Number(round);
 if(!Number.isInteger(r)||r<1||r>5)return false;
 // The original squad is always available to review, including after R1 locks.
 if(r===1)return true;
 if(!wcfNavGate.ready)return false; // No cached guesses on network failure.
 if(wcfNavGate.status.get(r-1)!=='scored')return false;
 const status=wcfNavGate.status.get(r);
 if(status==='open'||status==='scored')return true;
 // A closed round is historical only AFTER it has actually begun.
 if(status==='locked'){
  const first=wcfNavGate.firstKickoff.get(r);
  return Number.isFinite(first)&&Date.now()>=first;
 }
 return false;
}
function wcfRoundGateApply(rows){
 if(!Array.isArray(rows)||rows.length!==5||
    ![1,2,3,4,5].every(r=>rows.some(x=>Number(x.round_number)===r&&['open','locked','scored'].includes(x.status)))){
  wcfNavGate.ready=false;wcfNavGate.status.clear();
  if(mp.active)mp.allowedRounds.clear();
  if(state.round>1){state.round=1;selectedSlot=null;swappingFrom=null;posFilter='ALL';}
  return;
 }
 wcfNavGate.status=new Map(rows.map(x=>[Number(x.round_number),x.status]));
 wcfNavGate.firstKickoff=new Map();
 for(let r=1;r<=5;r++){
  const times=wcf13.fixtures.filter(x=>Number(x.round_number)===r)
   .map(x=>Date.parse(x.kickoff_at)).filter(Number.isFinite);
  if(times.length)wcfNavGate.firstKickoff.set(r,Math.min(...times));
 }
 wcfNavGate.ready=true;
 if(!wcfRoundGateCanSelect(state.round)){
  const was=state.round;
  state.round=1;selectedSlot=null;swappingFrom=null;posFilter='ALL';
  // Do not call save(): viewing a round must never submit a lineup trade.
  if(mp.active)console.warn('Round '+was+' not yet available; returning to R1.');
 }
}
roundNav=function(){

  const history=available&&status!=='open';
  const label=r<=3?'R'+r:r===4?'SF':'F';
  const hint=!available?(wcfNavGate.ready?'Not open yet — previous round must be finalised':'Checking round availability'):
   (history?'View previous round (read only)':`Select ${RD_NAMES[r]}`);
  return `<button type="button" data-round="${r}" class="${r===state.round?'on ':''}${!available?'wcf-future-round':history?'wcf-history-round':''}" title="${esc(hint)}" aria-label="${esc(RD_NAMES[r])}: ${esc(hint)}" ${available?'':'disabled aria-disabled="true"'}>${label}${available?'':'<span class="wcf-round-lock" aria-hidden="true">&#128274;</span>'}</button>`;
 }).join('')}</div>`;
};
